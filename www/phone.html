<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>bedremote</title>
<style>
:root{--bg:#000;--panel:#101013;--key:#1b1b20;--key2:#26262c;--line:#2e2e35;--fg:#eaeaea;
 --dim:#8a8a93;--acc:#4da3ff;--warn:#ffb454;--ok:#3ddc84;--bad:#ff5a5a;--r:12px;--gap:8px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--fg);overscroll-behavior:none;
 font:15px/1.3 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{display:flex;flex-direction:column;height:100dvh;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:var(--key);border:1px solid var(--line);border-radius:var(--r);
 min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
 line-height:1.15;touch-action:manipulation;padding:4px 6px;text-align:center}
button:active,button.on{background:#20304a;border-color:var(--acc);color:#fff}
button .sub{font-size:10px;color:var(--dim);font-weight:normal}
button.acc{background:#16324d;border-color:#2c5f8a}
#bar{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 6px) 10px 6px;
 background:var(--panel);border-bottom:1px solid var(--line);font-size:12px;color:var(--dim);flex:0 0 auto}
#dot{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:0 0 auto}
#dot.good{background:var(--ok)}
#win{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;color:#b9b9c2}
#bar button{min-height:30px;padding:0 10px;font-size:12px;border-radius:8px;flex:0 0 auto}
main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px}
section{display:none}section.show{display:block}
.mon{border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:8px;background:var(--panel)}
.mon.off{opacity:.62}
.monh{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.monh b{font-size:15px}
.tm{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:0 6px;white-space:nowrap}
.grid{display:grid;gap:var(--gap)}
.sect{font-size:11px;color:var(--dim);margin:14px 2px 6px;letter-spacing:.08em}
.sect:first-child{margin-top:2px}
/* ---- 触控板：笔记本那种布局 —— 键在上面一条，板子在下面占大头 ---- */
#padkeys{display:grid;grid-template-columns:1fr 64px 1fr;gap:var(--gap);margin-bottom:var(--gap)}
#padkeys button{min-height:58px}
#padkeys .mid{border-radius:26px}
#pad{position:relative;width:100%;height:calc(100dvh - 268px);min-height:210px;border-radius:16px;touch-action:none;overflow:hidden;
 background:radial-gradient(120% 120% at 50% 0%,#17171c,#0b0b0e);border:1px solid var(--line);
 display:flex;align-items:center;justify-content:center}
#pad .hint{color:#3a3a44;font-size:13px;pointer-events:none;text-align:center}
#pad.dragging{border-color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
#pbar{display:flex;align-items:center;gap:6px;margin-top:var(--gap);font-size:12px;color:var(--dim)}
#pbar input[type=range]{flex:1 1 auto;accent-color:var(--acc);height:30px;min-width:70px}
#pbar button{min-height:32px;padding:0 9px;font-size:12px;border-radius:8px;flex:0 0 auto;flex-direction:row}
#phelp{display:none}#phelp.on{display:block}
.mod.stuck{background:#3a2b12;border-color:var(--warn);color:#fff}
.in{background:var(--key);border:1px solid var(--line);border-radius:var(--r);color:var(--fg);
 font-size:16px;padding:0 12px;min-height:52px;outline:none;width:100%}
.in:focus{border-color:var(--acc)}
.row{display:flex;gap:var(--gap)}
.msg{background:var(--key);border-left:3px solid var(--acc);border-radius:8px;padding:9px 11px;
 font-size:14px;word-break:break-word;margin-bottom:6px}
.msg .tm{color:var(--dim);font-size:11px;margin-right:8px}
.msg.me{border-left-color:var(--ok)}.msg.ev{border-left-color:var(--warn)}
#okno{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);margin-bottom:var(--gap)}
#ok{background:#123021;border-color:var(--ok)}#no{background:#331518;border-color:var(--bad)}
nav{flex:0 0 auto;display:flex;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto}
nav button{flex:1 1 auto;border-radius:0;min-height:54px;background:transparent;border:none;font-size:14px;
 position:relative;min-width:72px;flex-direction:row;gap:4px}
nav button.sel{background:#17171d;color:#fff;box-shadow:inset 0 2px 0 var(--acc)}
#badge{min-width:18px;height:18px;border-radius:9px;background:var(--warn);color:#000;font-size:11px;
 font-weight:700;display:none;align-items:center;justify-content:center}
#off{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;flex-direction:column;
 align-items:center;justify-content:center;gap:16px;z-index:50;text-align:center;padding:24px}
#off.on{display:flex}
#qr{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;flex-direction:column;
 align-items:center;justify-content:center;gap:14px;z-index:70;text-align:center;padding:20px}
#qr.on{display:flex}
#qrbox{background:#fff;border-radius:14px;padding:16px;line-height:0}
#qrtxt{color:#dcdce2;font-size:13px;max-width:420px;line-height:1.6}
#qrtxt b{color:var(--warn)}
#qr .close{min-height:48px;padding:0 24px;background:var(--key);border:1px solid var(--line);color:var(--fg);font-size:14px}
#devs{color:var(--acc);font-weight:600}
#off button{min-height:56px;padding:0 26px;background:var(--acc);color:#00203d;border:none;font-weight:700}
.note{font-size:11px;color:var(--dim);margin-top:10px;line-height:1.6}
#lock{position:fixed;left:0;right:0;top:0;background:#5a2318;color:#ffd9d0;font-size:12px;
 padding:6px 10px;display:none;z-index:60}
/* ---- 多台电脑：顶部这台叫什么 + 一键换一台的名单 ---- */
#mname{color:var(--acc);font-weight:700;max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mach{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;flex-direction:column;z-index:72;padding:14px;overflow:auto}
#mach.on{display:flex}
#machh{font-size:14px;color:#dcdce2;margin:6px 2px 10px;font-weight:700}
.mi{display:flex;align-items:center;gap:8px;background:var(--key);border:1px solid var(--line);
 border-radius:12px;padding:11px 12px;margin-bottom:8px;font-size:14px}
.mi b{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi.cur{border-color:var(--acc);background:#16324d}
.mi .tm{flex:0 0 auto}
.mi button{min-height:40px;padding:0 14px;background:var(--acc);color:#00203d;border:none;font-weight:700;font-size:13px;flex:0 0 auto}
#machrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
#machrow button{min-height:40px;font-size:13px;flex:1 1 auto}
#machrow .close{background:var(--key);border:1px solid var(--line);color:var(--fg);font-weight:400}
/* 需要他做点什么的时候才出现的窄条：只说"缺什么 + 点哪个按钮"。
   陀螺仪和"装成 App"都卡在安全上下文/证书这一格上，而这一格没法一键跳过（浏览器不给 API），
   所以至少别让他自己诊断。 */
#tip{display:none;flex:0 0 auto;position:relative;background:#1d2431;border-top:1px solid #2c3a4d;color:#cfe0f5;
 font-size:12px;line-height:1.5;padding:7px 30px 7px 10px}
#tip.on{display:block}
#tip .x{position:absolute;right:6px;top:6px;min-height:26px;width:26px;padding:0;border-radius:7px;
 background:transparent;border:1px solid #33455e;color:#9fb6d0;font-size:13px;line-height:1}
#tip.on{display:block}
#tip b{color:#fff}
#tip .row2{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
#tip button{min-height:34px;padding:0 12px;font-size:12px;border-radius:8px;flex:0 0 auto;
 background:#20304a;border-color:var(--acc)}
#tip .note{margin-top:6px}
/* ---- 手柄：画布铺满，控件按 0..1 比例摆；进这一页就沉浸全屏 ---- */
#gp{position:relative;width:100%;height:calc(100dvh - 250px);min-height:300px;border-radius:16px;
 touch-action:none;overflow:hidden;background:radial-gradient(120% 100% at 50% 0%,#131318,#08080a);
 border:1px solid var(--line)}
.gpw{position:absolute;touch-action:none;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;
 font-size:13px;color:#c9c9d2;text-align:center;line-height:1.1;user-select:none}
.gpbtn{background:rgba(38,38,46,.72);border:1px solid #3a3a44;border-radius:14px}
.gpbtn.round{border-radius:50%}
.gpbtn.on{background:#20304a;border-color:var(--acc);color:#fff}
.gpstick{border:1px dashed #33333c;border-radius:50%;background:rgba(255,255,255,.02)}
.gpstick .knob{position:absolute;left:50%;top:50%;width:46%;height:46%;margin:-23% 0 0 -23%;
 border-radius:50%;background:rgba(77,163,255,.20);border:1px solid #35597d}
.gplook{border:1px dashed #2b2b33;border-radius:14px;background:rgba(255,255,255,.015);color:#3a3a44;font-size:11px}
.gpdpad{border:1px dashed #33333c;border-radius:14px;background:rgba(255,255,255,.02)}
.gpdpad .dirc{flex:0 0 50%;font-size:12px;color:#6b6b76}
.gpedit .gpw{outline:1px dashed var(--warn);outline-offset:-1px}
.gpedit .gpw.sel{outline:2px solid var(--acc);outline-offset:-2px}
/* 右上角那个半透明把手：平时淡到几乎看不见，点它才出菜单 */
#gphud{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 8px);z-index:45;width:40px;height:40px;
 min-height:40px;padding:0;border-radius:20px;background:rgba(24,24,29,.42);border:1px solid #2c2c33;
 color:#7f7f8a;font-size:17px;opacity:.5}
#gptb{display:none;position:fixed;left:0;right:0;bottom:0;z-index:46;background:rgba(14,14,17,.97);
 border-top:1px solid var(--line);padding:10px 10px calc(env(safe-area-inset-bottom) + 10px);
 gap:6px;align-items:center;font-size:12px;color:var(--dim);flex-wrap:wrap}
#gptb.on{display:flex}
#gptb button{min-height:40px;padding:0 11px;font-size:12px;border-radius:9px;flex:0 0 auto}
/* 预设那一行：占满一行，名字做成小胶囊 */
#gpprow{flex:1 1 100%;display:flex;gap:6px;align-items:center;flex-wrap:wrap;
 padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:4px}
#gpprof{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 auto}
#gpprof .pf{min-height:32px;padding:0 12px;border-radius:16px;font-size:13px;background:var(--key);
 border:1px solid var(--line);color:var(--dim)}
#gpprof .pf.on{background:#20304a;border-color:var(--acc);color:#fff;font-weight:700}
#gpprow button{min-height:32px;font-size:12px;padding:0 9px;flex:0 0 auto}
#gplag{flex:1 1 150px;font-size:11px;color:var(--ok)}
#gpst{flex:1 1 130px;font-size:11px;color:var(--dim)}
/* 属性面板：编辑时选中控件从底部滑出，一次改完所有字段（不再一层层弹 prompt） */
#gpp{display:none;position:fixed;left:0;right:0;bottom:0;z-index:47;background:#111216;border-top:1px solid var(--acc);
 padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);max-height:58dvh;overflow:auto}
#gpp.on{display:block}
#gpph{font-size:11px;color:var(--acc);margin-bottom:6px;letter-spacing:.06em}
#gppg{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px}
#gpp label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
#gpp label.ck{grid-column:1/-1}
#gpp input,#gpp select{flex:1 1 auto;min-width:0;background:var(--key);border:1px solid var(--line);color:var(--fg);
 border-radius:7px;min-height:36px;padding:0 8px;font-size:14px}
#gpp input.k4{width:54px;flex:0 0 54px}
#gpp input[type=range]{padding:0;accent-color:var(--acc)}
#gpp .grab{flex:0 0 auto;min-height:36px;font-size:12px;padding:0 9px;background:var(--key2);
 border:1px solid var(--line);color:var(--fg);border-radius:7px}
#gpp .grab.on{background:#3a2b12;border-color:var(--warn);color:#fff}
#gppb{display:flex;gap:8px;margin-top:8px}
#gppb button{flex:1 1 0;min-height:42px;font-size:13px}
#gppb #pOk{background:var(--acc);color:#00203d;border-color:var(--acc);font-weight:700}
/* 沉浸：上面那条状态栏、下面那排页签、还有提示条，操控时一律不许挡手 */
body.gpf #bar,body.gpf #nav,body.gpf #tip{display:none}
body.gpf{padding:0}
body.gpf main{padding:4px;height:100dvh;overflow:hidden}
body.gpf section.show{height:100%}
body.gpf #gp{height:100%;border:none;border-radius:0}
</style>
</head>
<body>
<div id="lock"></div>
<div id="bar"><span id="dot"></span><span id="rtt">—</span><span id="mname"></span><button id="swb">换一台</button><span id="devs"></span><span id="win">连接中…</span>
 <button id="fsb">⛶</button><button id="qrb">加设备</button><button id="editb">改按钮</button></div>
<main id="main"></main>
<div id="tip"></div>
<nav id="nav"></nav>
<div id="off"><div id="offmsg">连不上电脑</div><button onclick="location.reload()">重试</button></div>
<div id="qr"><div id="qrbox"></div><div id="qrtxt"></div><button class="close" id="qrclose">关闭</button></div>
<div id="mach"><div id="machh"></div><div id="machlist"></div>
 <div id="machrow"><button id="mrename">改这台的名称</button><button id="mpush">把面板推给它们</button><button id="mrescan">重新找</button><button class="close" id="machclose">关闭</button></div>
 <div class="note" id="machtip"></div></div>

<script src="vendor/qrcode.js"></script>
<script>
(function(){
"use strict";
var T=(location.search.match(/[?&]t=([^&]+)/)||[])[1]||"";
// 页面自己的版本号。服务端版本比它新就说明"你手里这个标签页是旧的"，自动刷一次。
// 不加这个的话，我改了行为你却还在跑旧 JS，看起来就像"功能坏了/关不上"——今晚真的踩过。
var BUILD="0.11.0";
var $=function(s){return document.querySelector(s)};
var main=$("#main"), nav=$("#nav");
var buzz=function(m){try{navigator.vibrate&&navigator.vibrate(m||12)}catch(e){}};

function api(p){
  return fetch("/cmd?t="+encodeURIComponent(T)+"&"+p,{cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("http"+r.status);
    return r.text();
  });
}
var inflight=0;
function send(p){
  if(inflight>6) return Promise.resolve("busy");
  inflight++;
  return api(p).then(function(x){inflight--;return x},function(e){inflight--;offline(true);return "err"});
}

/* ---------- 连接 ---------- */
function offline(v){
  $("#dot").className=v?"":"good";
  if(v){$("#offmsg").textContent="连不上电脑：PC 上的 bedremote 还开着吗 / 手机和 PC 在同一个路由器吗 / 防火墙放行了吗";$("#off").classList.add("on");}
  else $("#off").classList.remove("on");
}
function ping(){
  var t0=performance.now();
  api("c=ping&ts="+t0).then(function(){
    $("#rtt").textContent=Math.round(performance.now()-t0)+"ms";offline(false);
  },function(){offline(true)});
}
setInterval(ping,2000);ping();

var es=null,unseen=0,curTab=0;
function sse(){
  try{if(es)es.close()}catch(e){}
  es=new EventSource("/events?t="+encodeURIComponent(T));
  es.onmessage=function(m){
    var d;try{d=JSON.parse(m.data)}catch(e){return}
    if(d.e==="win")$("#win").textContent=d.t||"（无标题窗口）";
    else if(d.e==="msg")addMsg(d.t,"");
    else if(d.e==="reply"){addMsg(d.t,"me");$("#okno").style.display="none"}
    else if(d.e==="ask"){addMsg(d.t,"ev");$("#okno").style.display="grid"}
    else if(d.e==="locked")showLock(d.t,d.why==="uac");
    else if(d.e==="unlock")hideLock();
    else if(d.e==="panel")loadPanel();
    else if(d.e==="name")loadMates();          // 有人给这台电脑改了名，顶部那行跟着换
    else if(d.e==="lag")gpLagGot(d.t0,+d.srv||0);
    else if(d.e==="mons")loadMons();
    else if(d.e==="peers")showPeers(d);
    else if(d.e==="ver"){
      // 服务端比这个标签页新 → 自己刷一次（sessionStorage 保证只刷一次，不会来回刷）
      try{
        if(d.t && d.t.indexOf(BUILD)!==0 && !sessionStorage.getItem("br_reload")){
          sessionStorage.setItem("br_reload","1");
          location.reload();
        }
      }catch(e){}
    }
    else if(d.e==="reset")$("#log").innerHTML="";
  };
  es.onerror=function(){/* EventSource 自己会重连 */};
}
document.addEventListener("visibilitychange",function(){if(!document.hidden){sse();ping()}else if(TILT&&TILT.run){tiltStop()}});
// 手机切后台/失焦时把"按住"状态清掉，否则回来会一直发位移（触控板踩过同一个坑）
addEventListener("pagehide",function(){if(TILT)TILT.holding=false});
addEventListener("blur",function(){if(TILT)TILT.holding=false});
function showLock(t,keep){var e=$("#lock");e.textContent=t;e.style.display="block";clearTimeout(e._t);
  // UAC 那种要人去点一下的，红条多留一会（20 秒），别一闪就没让人以为是自己手滑
  e._t=setTimeout(function(){e.style.display="none"},keep?20000:9000)}
function hideLock(){var e=$("#lock");if(e){clearTimeout(e._t);e.style.display="none"}}

/* ---------- 动作 DSL ---------- */
function fire(b){
  buzz();
  var a=b.act;
  if(b.confirm&&!confirm(b.confirm))return;
  var e=function(s){return encodeURIComponent(s==null?"":s)};
  if(a==="key")   send(mods.length?"c=combo&k="+e(b.key)+"&m="+e(mods.join("+")):"c=key&k="+e(b.key));
  else if(a==="combo") send("c=combo&k="+e(b.key)+"&m="+e(b.mods||""));
  else if(a==="text")  send("c=text&s="+e(b.text||""));
  else if(a==="paste") send("c=paste&s="+e(b.text||""));
  else if(a==="screen")  send("c=screen&n="+e(b.n==null?"tv":b.n));
  else if(a==="power")   send("c=power");
  else if(a==="awake"){ awake=!awake; send("c=awake&on="+(awake?1:0)); }
  else if(a==="run")     send("c=run&n="+e(b.name||""));
  else if(a==="reload")  location.reload();
  else if(a==="tab")     show(+b.n||0);
  else if(a==="clearmods") clearMods();
  if(a==="key"||a==="combo") clearMods();
}

/* ---------- 配置面板渲染 ---------- */
var panels=null;
function loadPanel(){
  fetch("/panel?t="+encodeURIComponent(T),{cache:"no-store"}).then(function(r){return r.json()}).then(function(p){
    panels=p;try{localStorage.setItem("br_panel",JSON.stringify(p))}catch(e){}
    render();
  },function(){
    try{panels=JSON.parse(localStorage.getItem("br_panel")||"null")}catch(e){}
    render();
  });
}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

function render(){
  try{releaseBtn()}catch(e){}      // 重建 DOM 前先把左键松开，否则状态会和按钮对不上、甚至一直按着
  main.innerHTML="";nav.innerHTML="";
  var tabs=(panels&&panels.tabs)||[];
  var n=0;
  tabs.forEach(function(tab){
    var sec=el("section");sec.id="s"+n;
    (tab.groups||[]).forEach(function(g){
      if(g.title)sec.appendChild(el("div","sect",g.title));
      var grid=el("div","grid");
      grid.style.gridTemplateColumns="repeat("+(g.cols||4)+",1fr)";
      (g.buttons||[]).forEach(function(b){
        var e=el("button",b.class||"",b.label||"·");
        if(b.act==="awake"&&awake)e.classList.add("on");
        if(b.sub){var s=el("span","sub",b.sub);e.appendChild(s)}
        e.act=b.act;e.b=b;
        e.onclick=function(){fire(this.b);if(this.act==="awake")this.classList.toggle("on",awake)};

try{var ls=localStorage.getItem("br_sp");if(ls){speed=+ls}}catch(e){}
try{if(localStorage.getItem("br_abs")==="1")absMode=true}catch(e){}
function btnDown(){return dragging||holding}
function paintPadBtns(){
  var d=$("#bDrag");if(d){d.textContent="拖拽:"+(dragging?"开":"关");d.classList.toggle("on",dragging)}
  var a=$("#absMode");if(a){a.textContent="点哪跳哪:"+(absMode?"开":"关");a.classList.toggle("on",absMode)}

// 左键一定要保证能松开：拖到一半页面切后台/掉线，Windows 那边会一直"按着左键"，
// 之后你点什么都变成拖拽，特别难缠。
function releaseBtn(){
  if(holdTO){clearTimeout(holdTO);holdTO=0}
  if(!dragging&&!holding)return;

function padSection(){
  var s=el("section");
  s.innerHTML=
   '<div id="padkeys">'+
   '<button id="kLeft">左键<span class="sub">轻点=单击 · 长按=按住拖</span></button>'+
   '<button id="kMid" class="mid">中</button>'+

   '<div class="note" id="phelp">'+

   '<b>双击</b>：连着轻点两下「左键」就是双击（跟笔记本一样）。<br>'+

   '开"点哪跳哪"后按下手指会把光标直接放到对应的桌面位置。拖拽中不会触发双指滚轮，免得又拖又滚。</div>';
  setTimeout(function(){wirePad(s)},0);

function wirePad(s){
  $("#sp").value=speed;
  $("#sp").oninput=function(){speed=+this.value;try{localStorage.setItem("br_sp",speed)}catch(e){}};
  $("#absMode").onclick=function(){absMode=!absMode;try{localStorage.setItem("br_abs",absMode?"1":"0")}catch(e){};buzz();paintPadBtns()};
  $("#bDrag").onclick=function(){buzz();dragging=!dragging;if(!dragging&&holding){holding=false}if(dragging)send("c=btn&b=left&d=up");paintPadBtns()};
  $("#bHelp").onclick=function(){buzz();$("#phelp").classList.toggle("on")};
  // 左键：轻点=单击；按住 420ms 不松=进入"按住拖"（另一根手指在板上滑），抬起那根手指就松键。
  // 判定放在 pointerup 而不是 pointerdown 之后延时 —— 延时发单击会有手感延迟，而"要不要转成按住"
  // 只有定时器知道，所以抬手时按 lpHold 决定发 click 还是发 up。
  var kl=$("#kLeft"),lpTO=0,lpHold=false,lpDown=false;
  kl.addEventListener("pointerdown",function(e){
    e.preventDefault();buzz();lpDown=true;lpHold=false;
    if(lpTO)clearTimeout(lpTO);
    lpTO=setTimeout(function(){lpTO=0;lpHold=true;holding=true;
      send("c=btn&b=left&d=down");paintPadBtns();
      if(holdTO)clearTimeout(holdTO);
      holdTO=setTimeout(function(){holdTO=0;if(holding)releaseBtn()},15000)},420);
  });
  function lift(){
    if(!lpDown)return;lpDown=false;
    if(lpTO){clearTimeout(lpTO);lpTO=0}
    if(lpHold){lpHold=false;if(holding){holding=false;if(holdTO){clearTimeout(holdTO);holdTO=0}send("c=btn&b=left&d=up")}}
    else send("c=btn&b=left&d=click");
    paintPadBtns();
  }
  ["pointerup","pointercancel","pointerleave"].forEach(function(ev){kl.addEventListener(ev,lift)});
  $("#kRight").onclick=function(){buzz();send("c=btn&b=right&d=click")};
  $("#kMid").onclick=function(){buzz();send("c=btn&b=mid&d=click")};
  paintPadBtns();
  var pad=$("#pad"),pts={},multi=false,my=0;
  pad.addEventListener("pointerdown",function(e){
    try{pad.setPointerCapture(e.pointerId)}catch(x){}
    pts[e.pointerId]={x:e.clientX,y:e.clientY};
    multi=Object.keys(pts).length>=2;
    if(!multi){my=e.clientY;
      if(absMode){var r=pad.getBoundingClientRect();
        send("c=abs&x="+((e.clientX-r.left)/r.width).toFixed(4)+"&y="+((e.clientY-r.top)/r.height).toFixed(4))}
      if(dragging)send("c=btn&b=left&d=down");
    }
    e.preventDefault();
  });
  pad.addEventListener("pointermove",function(e){
    var p=pts[e.pointerId];if(!p)return;
    var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
    if(multi&&!btnDown()){var d=e.clientY-my;my=e.clientY;var l=Math.round(d/28);if(l)send("c=wheel&d="+(-l*120));return}
    if(!absMode)move(dx*speed,dy*speed);
    e.preventDefault();
  });
  function up(e){if(!pts[e.pointerId])return;delete pts[e.pointerId];
    multi=Object.keys(pts).length>=2;
    if(!Object.keys(pts).length&&dragging)send("c=btn&b=left&d=up")}
  pad.addEventListener("pointerup",up);pad.addEventListener("pointercancel",up);
  pad.addEventListener("contextmenu",function(e){e.preventDefault()});
}
// 位移累积 + 30ms 合并发送：以前每帧一个请求（约 60/秒），撞上 inflight 上限就被丢掉，
// 而丢掉的那段距离已经从累加器里扣掉了 —— 这就是"拖拽不跟手、拖一半停了"的根因。
// 现在：合并成一步大步长发，而且**没发出去就还回累加器**，绝不丢位移。
var accX=0,accY=0,mTimer=0;
function move(dx,dy){accX+=dx;accY+=dy;if(!mTimer)mTimer=setTimeout(flush,30)}
function flush(){
  mTimer=0;
  if(absMode)return;
  var dx=Math.round(accX),dy=Math.round(accY);
  if(!dx&&!dy)return;
  accX-=dx;accY-=dy;
  var t=send("c=move&dx="+dx+"&dy="+dy);
  if(t&&t.then)t.then(function(x){if(x==="busy"||x==="err"){accX+=dx;accY+=dy}});
}

/* ---------- 陀螺仪 ---------- */
// 躺着的时候抬手摩擦触控板是个体力活，而且手一抖就点歪；倾斜控标是"手腕动 3 度"的事。
// 关键点：
//  1) 相对当前姿态算，不是绝对角度 —— 手机平放、斜放、立着都能用，按「归零」重新定中点。
//  2) 默认"按住才动"：不按住时倾斜不动光标，换个姿势不会把光标甩到天涯海角。
//  3) 传感器事件在 http:// 下**根本不触发**（Chrome/Safari 把它当敏感能力），所以这页要 https 进。
//  4) 位移累加器：发不出去（限流/断网）时要把发出去的份额还回去，不然"丢距离"——触控板踩过。
var TILT={b0:null,g0:null,beta:null,gamma:null,got:0,sens:130,dead:1.5,invX:1,invY:1,
          run:false,hold:false,ax:0,ay:0,last:0,timer:0,max:1600,paint:0};
function tiltPref(k,v){ try{ var x=localStorage.getItem("br.tilt."+k); return x===null?v:JSON.parse(x) }catch(e){ return v } }
function tiltSave(k,v){ try{ localStorage.setItem("br.tilt."+k,JSON.stringify(v)) }catch(e){} }
function az(v,d){ return Math.abs(v)<=d?0:(Math.abs(v)-d)*(v<0?-1:1) }   // 死区：削掉中间那段
function tiltAngle(){
  var ax=0,ay=0;
  if(TILT.got&&TILT.b0!==null){
    ax=az(TILT.gamma-TILT.g0,TILT.dead)*TILT.invX;
    ay=az(TILT.beta -TILT.b0 ,TILT.dead)*TILT.invY;
  }
  return [ax,ay];
}
function tiltStep(){
  if(++TILT.paint%6===0) tiltPaint();          // 读数按 ~5Hz 刷，别每帧动 DOM
  if(TILT.hold&&!TILT.holding){ TILT.ax=0; TILT.ay=0; return }   // "按住才动"开着且没按着：一点不发
  var now=Date.now(), dt=(now-TILT.last)/1000; TILT.last=now;
  if(!(dt>0)||dt>0.4) dt=0.033;
  var a=tiltAngle();
  var vx=Math.max(-TILT.max,Math.min(TILT.max,a[0]*TILT.sens));
  var vy=Math.max(-TILT.max,Math.min(TILT.max,a[1]*TILT.sens));
  TILT.ax+=vx*dt; TILT.ay+=vy*dt;
  var dx=Math.trunc(TILT.ax), dy=Math.trunc(TILT.ay);
  if(!dx&&!dy) return;
  TILT.ax-=dx; TILT.ay-=dy;
  send("c=move&dx="+dx+"&dy="+dy).then(function(r){
    if(r==="busy"||r==="err"||r==="locked"){ TILT.ax+=dx; TILT.ay+=dy }   // 没发出去，还回累加器
  });
}
function tiltPaint(){
  var e=$("#tiltRead"); if(!e) return;
  var a=tiltAngle();
  e.textContent = (TILT.got? (Math.round(TILT.gamma)+"° / "+Math.round(TILT.beta)+"°") : "没有数据")
    + (TILT.b0===null?"":"　偏移 "+a[0].toFixed(1)+" , "+a[1].toFixed(1));
  var s=$("#tiltCfg"); if(s) s.textContent="灵敏度 "+TILT.sens+" px/s/度　·　死区 "+TILT.dead.toFixed(1)+"°";
  var b=$("#tiltRun"); if(b) b.textContent=TILT.run?"停止":"开始动";
  var m=$("#tiltMode"); if(m) m.innerHTML = TILT.hold
    ? '按住才动 ✓<span class="sub">点一下改成一直动</span>' : '一直动（不用按着）<span class="sub">点一下改回按住才动</span>';
  var h=$("#tiltHold"); if(h) h.classList.toggle("on",TILT.hold);
  var w=$("#tiltWake"); if(w) w.textContent = (TILT.run&&TILT.wlOn)?"屏幕常亮 ✓":"屏幕常亮 —";
}
function tiltStart(){
  if(TILT.run) return;
  TILT.run=true; TILT.last=Date.now(); TILT.ax=0; TILT.ay=0;
  window.addEventListener("deviceorientation",onOri);
  TILT.timer=setInterval(tiltStep,33);
  tiltWake(true);
  if(!TILT.got) setTimeout(function(){ if(TILT.run&&!TILT.got) tiltHint() },1500);
  tiltPaint();
}
function tiltStop(){
  TILT.run=false;
  if(TILT.timer){ clearInterval(TILT.timer); TILT.timer=0 }

  tiltWake(false);
  tiltPaint();
}
function onOri(e){
  if(e.beta===null&&e.gamma===null) return;

  if(TILT.b0===null) tiltZero();
}
function tiltZero(){ TILT.b0=TILT.beta===null?0:TILT.beta; TILT.g0=TILT.gamma===null?0:TILT.gamma; TILT.ax=0; TILT.ay=0; tiltPaint() }
function tiltHint(){
  var m=$("#tiltHint"); if(!m) return;
  m.innerHTML = location.protocol!=="https:"
    ? '<b style="color:#ffb4a0">这页不是 https:// 打开的（现在是 '+location.protocol+'//）—— 手机浏览器在非 HTTPS 下不给陀螺仪数据（事件根本不触发）。</b><br>电脑上那个界面里勾了「手机走 HTTPS」之后，扫配对页出的 https 二维码进来就有了。'
    : '没收到陀螺仪数据。这台设备可能没有陀螺仪（不少平板/低端机没有），或者浏览器把它关了。';
}
function tiltWake(on){
  TILT.wlOn=false;

    w.addEventListener("release",function(){ TILT.wlOn=false })

}
function tiltSection(){

  h+='<div class="sect">按住下面这个大按钮，光标才跟着倾斜走（松手立刻停）</div>';
  h+='<button id="tiltHold" class="big">按住我：光标才跟着倾斜动<span class="sub">松手立刻停</span></button>';

  h+='<div class="note" id="tiltHint"></div>';

function wireTilt(s){
  var hold=$("#tiltHold");
  function press(e){ e.preventDefault(); if(!TILT.run) tiltStart(); TILT.holding=true; hold.classList.add("stuck") }
  function lift(e){ if(!TILT.holding) return; TILT.holding=false; hold.classList.remove("stuck");

/* ---------- 手柄（手机当游戏控制器） ---------- */
// 布局里只有"键名 + 比例坐标"，不出现任何游戏名字：换个人、换个手机都能用。
// 坐标约定：x/y = 控件左上角占画布宽/高的比例；w/h 按 min(宽,高) 算，所以正方形在横竖屏下还是正方形。
// 所有控件（按钮 / 摇杆 / 视角区 / 十字键）挤在同一个 widgets 数组里 —— 这样"再加一个摇杆"、
// "两块视角区"这类需求不用改任何代码，也不用给每种控件单独存一份。
var GP_DEF={
  widgets:[
    {id:"stick1",kind:"stick",x:0.035,y:0.545,w:0.39,h:0.39,keys:["w","a","s","d"],run:"shift",runAt:0.82,dead:0.16},
    {id:"look1",kind:"look",x:0.44,y:0.03,w:0.54,h:0.58,sens:1.5,invX:1,invY:1},
    {id:"b1",x:0.615,y:0.700,w:0.235,h:0.235,round:1,label:"攻击",act:"mb",k:"left",mode:"hold"},
    {id:"b2",x:0.505,y:0.885,w:0.165,h:0.165,round:1,label:"交互",act:"key",k:"e",mode:"tap"},
    {id:"b3",x:0.700,y:0.885,w:0.165,h:0.165,round:1,label:"跳跃",act:"key",k:"space",mode:"tap"},
    {id:"b4",x:0.865,y:0.760,w:0.125,h:0.125,round:1,label:"1",act:"key",k:"1",mode:"tap"},
    {id:"b5",x:0.865,y:0.615,w:0.125,h:0.125,round:1,label:"2",act:"key",k:"2",mode:"tap"}
  ],

};
var GP={set:null,lay:null,edit:false,sel:"",on:false,timer:0,root:null,
        sent:"",ax:0,ay:0,
        ptr:{},latch:{},rep:{},stickPtr:{},lookPtr:{},
        lag:{pend:{},ms:-1,srv:-1,timer:0,n:0,sum:0,max:0}};
function gpClone(o){ return JSON.parse(JSON.stringify(o)) }
function gpId(){ return "w"+Date.now().toString(36)+Math.floor(Math.random()*900+100) }
// 一套"布局集" = {active:当前预设名, ts:最后一次真改动的时刻, profiles:{名字:{widgets,opt}}}。
// ts 是用来"跟着人走"的：布局存在每台电脑上，但人在机器之间走 —— 谁新谁赢，
// 手机上这份更新过，连到另一台时就自动推过去，不用每台重摆一遍。
function gpSetName(n){ var s=String(n==null?"":n).trim().slice(0,20); return s.length?s:"默认" }
function gpFixSet(raw){
  var s=null;
  try{ s=(raw&&raw.profiles)?raw:null }catch(e){}
  if(!s) s={active:"默认",ts:0,profiles:{"默认":gpFix(raw&&raw.buttons?raw:(raw||gpClone(GP_DEF)))}};
  var out={};
  Object.keys(s.profiles||{}).forEach(function(k){ out[gpSetName(k)]=gpFix(s.profiles[k]||{}) });
  if(!Object.keys(out).length) out["默认"]=gpFix(gpClone(GP_DEF));
  s.profiles=out;

function gpCur(){ return GP.set.profiles[GP.set.active] }
function gpTouched(){ GP.set.ts=Date.now(); try{ localStorage.setItem("br.gp",JSON.stringify(GP.set)) }catch(e){} }
function gpLocalSet(){ try{ var x=JSON.parse(localStorage.getItem("br.gp")||"null"); return x?gpFixSet(x):null }catch(e){ return null } }
function gpLoad(cb){
  fetch("/gamepad?t="+encodeURIComponent(T),{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){
    var pc=d?gpFixSet(d):null, ph=gpLocalSet(), s=pc, src="电脑上的";
    if(ph&&(!pc||ph.ts>pc.ts)){ s=ph; src="本机这份比电脑新" }
    if(!s){ s=gpFixSet(null); src="内置的" }

function gpMsg(t){ var e=$("#gpst"); if(e) e.textContent=t }
// 老布局（stick/look/buttons 三段）迁成统一的 widgets；顺便补齐缺字段，以后加类型也不会崩
function gpFix(l){
  var d=GP_DEF, out={opt:l.opt||gpClone(d.opt), widgets:[]};
  var old=[];
  if(l.widgets&&l.widgets.length) old=l.widgets;

/* ---- 延迟：手机发个时间戳，电脑原样退回，同一个钟算差值，不用两边对表 ---- */

function gpLagGot(id,srv){

function gpLocal2(px,py){

function gpBind(){

function gpById(id){ return GP.lay.widgets.filter(function(w){return w.id===id})[0]||null }

function gpStick(id,px,py,off){

function gpTap(w){

function gpWanted(){
  var ks=[],mb=[],L=GP.lay;

  L.widgets.forEach(function(w){
    var held=!!GP.ptr[w.id], lit=!!GP.latch[w.id];

      var v=w._vec, th=0.42, dead=w.dead==null?0.16:w.dead, K=w.keys||[];

        if(Math.abs(v.uy)>=th) addKey(K[v.uy<0?0:2]);

      }

  var now=Date.now();
  GP.lay.widgets.forEach(function(w){
    if(w.kind!=="btn"||w.mode!=="repeat"||!GP.ptr[w.id]) return;
    var ev=Math.max(60,+w.every||180);
    if(GP.rep[w.id]&&now-GP.rep[w.id]<ev) return;
    GP.rep[w.id]=now;
    if(w.act==="mb") send("c=btn&b="+encodeURIComponent(w.k));
    else if(w.act==="combo") send("c=combo&k="+encodeURIComponent(w.k)+"&m="+encodeURIComponent(w.mods||""));
    else send("c=key&k="+encodeURIComponent(w.k));

    '" viewBox="0 0 '+dim+' '+dim+'" shape-rendering="crispEdges"><rect width="'+dim+

  var u=selfUrl();
  var qr=qrcode(0,'M'); qr.addData(u); qr.make();
  var n=qr.getModuleCount();
  var cell=Math.max(3,Math.min(11,Math.floor(Math.min(window.innerWidth-80,window.innerHeight*0.46)/(n+8))));
  $("#qrbox").innerHTML=qrSvg(u,cell);
  $("#qrtxt").innerHTML=
    "<b>别人扫这个码就能连上这台电脑</b>，跟你用的是同一个页面，不用碰电脑、不用输地址。<br>"+
    "扫的人能动你的鼠标键盘 —— 家里人给，陌生人别给。"+
    (T?"<br>地址里带着令牌，他扫完即直连。"
       :"<br>你现在没设令牌：局域网里任何设备<em>不用扫码</em>也能动你的鼠标键盘。想收紧就在 bedremote.json 里设 token。")+
    "<div id=\"qrpeers\" style=\"margin-top:8px;color:#9a9aa5;font-size:12px\"></div>";
  $("#qr").classList.add("on");
  loadPeers();
}
$("#qrb").onclick=function(){buzz();showQr()};
$("#qrclose").onclick=function(){buzz();$("#qr").classList.remove("on")};
addEventListener("keydown",function(e){if(e.key==="Escape")$("#qr").classList.remove("on")});
loadPeers();
setInterval(loadPeers,20000);
document.addEventListener("click",function(e){
  var t=e.target;if(t.tagName==="BUTTON"&&t.classList.contains("acc"))t.classList.add("on")});
/* ---------- 装成 App（PWA）：安卓分享面板里出现 bedremote 的前提 ---------- */
(function(){
  // manifest 用 JS 挂：设了令牌的话 href 必须带 ?t=，否则 Chrome 取清单会被 403，App 装不上。
  var ml=document.createElement("link");ml.rel="manifest";
  ml.href="/manifest.webmanifest"+(T?"?t="+encodeURIComponent(T):"");
  document.head.appendChild(ml);
  // SW 只在 https 下注册。注意：Chrome 注册 SW 要求证书**被信任**，绕过警告页不算 ——
  // 所以裸自签模式下这一句注定失败，是预期内的，静默忽略。
  // 想装 App / 要分享面板：把 bedremote.json 里 ca 改成 true，再在手机上装一次 /ca.crt。
  if(location.protocol==="https:"&&navigator.serviceWorker){
    try{navigator.serviceWorker.register("/sw.js"+(T?"?t="+encodeURIComponent(T):"")).then(function(){SWOK="ok";paintTip()},function(){SWOK="fail";paintTip()})}catch(e){SWOK="fail";paintTip()}
  }
  // 分享面板 → 服务端 /share 处理完 302 回这里，把结果说一句，然后把参数抹掉（免得刷新重复打开）
  var sh=(location.search.match(/[?&]shared=([^&]*)/)||[])[1];
  if(sh){
    try{sh=decodeURIComponent(sh)}catch(e){}
    setTimeout(function(){addMsg("分享到电脑："+sh,"")},500);
    try{history.replaceState(null,"",location.pathname+(T?"?t="+encodeURIComponent(T):""))}catch(e){}
  }
})();
/* ---------- 多台电脑：认名字 + 一键换一台 ---------- */
// 屋里一排机器时，"192.168.1.7" 和 "7号机" 的差别就是能不能用。
// 名单从**当前这台**问出来（c=mates：电脑之间靠 UDP 心跳互相知道对方存在），
// 再并上本机记过的地址 —— 某台没听到心跳（跨网段、刚开机）也还能一键回去。
var MACH={list:[],me:null};
function mEsc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function mHist(){try{var a=JSON.parse(localStorage.getItem("br.mach")||"[]");return a instanceof Array?a:[]}catch(e){return[]}}
function mRemember(list){
  try{
    var h=mHist(),by={};
    h.forEach(function(m){by[m.ip+":"+m.port]=m});
    list.forEach(function(m){ if(m&&m.ip) by[m.ip+":"+m.port]={ip:m.ip,port:m.port,name:m.name,https:!!m.https,ts:Date.now()} });
    var arr=[];for(var k in by)arr.push(by[k]);
    arr.sort(function(a,b){return b.ts-a.ts});
    localStorage.setItem("br.mach",JSON.stringify(arr.slice(0,24)));
  }catch(e){}
}
function mUrl(m){
  return (m.https?"https://":"http://")+m.ip+":"+m.port+"/" + (T?"?t="+encodeURIComponent(T):"");
}
function loadMates(){
  return api("c=mates").then(function(t){
    var d;try{d=JSON.parse(t)}catch(e){d=null}
    MACH.list=(d instanceof Array)?d:[];
    MACH.me=MACH.list.filter(function(m){return m.self})[0]||null;
    mRemember(MACH.list);
    var e=$("#mname");
    if(e)e.textContent=MACH.me?MACH.me.name:"";
    return MACH.list;
  },function(){return []});
}
function mMerge(){
  var out=[],by={};
  MACH.list.forEach(function(m){ var k=m.ip+":"+m.port; by[k]=m; out.push(m) });
  mHist().forEach(function(m){
    var k=m.ip+":"+m.port;
    if(by[k])return;
    m.gone=true;
    if(m.ip===location.hostname&&+m.port===(location.port?+location.port:80))return;  // 就是本机却已经不在名单里：别说它"没应答"
    out.push(m);
  });
  out.sort(function(a,b){
    if(a.self!==b.self)return a.self?-1:1;
    if(!!a.gone!==!!b.gone)return a.gone?1:-1;
    return String(a.name||a.ip).localeCompare(String(b.name||b.ip));
  });
  return out;
}
function mPaint(){
  var box=$("#machlist");if(!box)return;
  var l=mMerge();
  if(!l.length){box.innerHTML='<div class="note">还没发现别的电脑。点「重新找」问一圈。</div>';return}
  var h="";
  l.forEach(function(m,i){
    h+='<div class="mi'+(m.self?" cur":"")+'"><b>'+(m.self?"【当前】":"")+mEsc(m.name||m.ip)+'</b>'+
       '<span class="tm">'+mEsc(m.ip)+':'+m.port+(m.mon?(" · "+m.mon+"屏"):"")+'</span>'+
       (m.gone?'<span class="tm" style="color:var(--warn);border-color:var(--warn)">没应答</span>':'')+
       (m.self?'<span class="tm">就是这台</span>':'<button data-go="'+i+'">切过去</button>')+'</div>';
  });
  box.innerHTML=h;
  var bs=box.querySelectorAll("button[data-go]");
  for(var i=0;i<bs.length;i++)bs[i].onclick=function(){
    var m=l[+this.dataset.go];if(!m)return;
    buzz();mRemember([m]);
    if(!confirm("切到「"+(m.name||m.ip)+"」("+m.ip+":"+m.port+")？\n\n页面会重新加载。如果那台电脑设了**不同的令牌**，会连不上，那就在那台上把地址重扫一次。"))return;
    location.href=mUrl(m);
  };
  var tip=$("#machtip");
  if(tip)tip.textContent="名单是这些电脑自己互相打招呼凑出来的（同网段免配置）。跨网段/被交换机挡住时这里就少几台，用「重新找」单播问一圈。";
}
function mOpen(){ mPaint(); $("#mach").classList.add("on"); loadMates().then(mPaint) }
window.machOpen=mOpen;   // 手柄那个"换一台"按钮要用（同一个 IIFE，但留个显式出口更好读）
function mClose(){ $("#mach").classList.remove("on") }
function mRename(){
  var cur=MACH.me?MACH.me.name:"";
  var want=prompt("这台电脑叫什么？（比如「7号机」「渲染那台」。留空 = 用 Windows 的电脑名）",cur);
  if(want===null)return;
  send("c=name&n="+encodeURIComponent(want));
  setTimeout(function(){loadMates().then(mPaint)},600);
}
function mRescan(){
  var tip=$("#machtip");if(tip)tip.textContent="在问这一段的 254 个地址…";
  api("c=scan").then(function(t){
    var d;try{d=JSON.parse(t)}catch(e){d=null}
    if(d instanceof Array){MACH.list=d;mRemember(d)}
    mPaint();var e=$("#mname");if(e&&MACH.me)e.textContent=MACH.me.name;
  },function(){if(tip)tip.textContent="问不动：连不上当前这台电脑"});
}
function mPush(){
  var others=mMerge().filter(function(m){return !m.self&&!m.gone});
  if(!others.length){alert("名单里没有别的电脑（先「重新找」）");return}
  var names=others.map(function(m){return m.name||m.ip}).join("、");
  if(!confirm("把**这台**的面板（页签和按钮）覆盖到："+names+"\n\n只动对方的 panels 那一段，它们的端口/令牌/白名单都不动。对方机器上会留一行日志。继续？"))return;
  send("c=push&to=all").then(function(t){ addMsg("推送结果："+t,"") });
}
$("#swb").onclick=function(){buzz();mOpen()};
$("#machclose").onclick=mClose;
$("#mrename").onclick=mRename;
$("#mrescan").onclick=mRescan;
$("#mpush").onclick=mPush;
addEventListener("keydown",function(e){if(e.key==="Escape")$("#mach").classList.remove("on")});

loadPanel();sse();loadMates();
  // 顶部那条"还缺什么"：陀螺仪和"装成 App"卡的是同一件事（安全上下文 / 证书被信任），
  // 而这两件都没法由网页替他点（浏览器不给装证书的 API）。至少把它诊断出来、按钮递到手边。
  var installEvt=null;
  addEventListener("beforeinstallprompt",function(e){ e.preventDefault(); installEvt=e; paintTip() });
  addEventListener("appinstalled",function(){ installEvt=null; var b=$("#tip"); if(b)b.classList.remove("on") });
  var standalone=false;
  try{ standalone=(matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true }catch(e){}
  function paintTip(){
    var box=$("#tip"); if(!box) return;
    // 这条只对"手机从局域网打开"有意义：在电脑本机上 http://127.0.0.1 本来就是安全上下文，
    // 而且 Chrome 允许从 localhost 装 PWA，提示只会误导。
    if(location.hostname==="127.0.0.1"||location.hostname==="localhost"){ box.classList.remove("on"); return }
    if(standalone){ box.classList.remove("on"); return }
    // 关掉了就别再挡手（操控类页面它真的会挡住一指宽的地方）。想再看回来在「丢过去」那页底部。
    var off=false; try{ off=localStorage.getItem("br.tipoff")==="1" }catch(e){}
    if(off){ box.classList.remove("on"); return }
    var h;
    if(location.protocol!=="https:"){
      h='<b>现在是 http 打开的这一页。</b>陀螺仪和"装到桌面"都要 https 才给 —— 同一个端口就支持，换个协议头就行。'+
        '<div class="row2"><button id="tipGo">用 https 打开</button></div>';
    } else if(SWOK==="ok"){
      h='<b>这台手机已经信任这张证书了。</b>装到桌面就有自己的图标、全屏、没有地址栏。'+
        '<div class="row2"><button id="tipIns">装到桌面</button><button id="tipQ">没有按钮？</button></div>';
    } else {
      h='<b>没能确认这台手机已经信任了证书。</b>注意这条是"离线组件注册成功"推出来的，可能误报'+
        '（无痕模式一定注册不了，所以一定误报）。真正要看的是：打开 https 时还弹不弹"不受信任"。'+
        '<div class="row2"><button id="tipChk">到底信没信？</button><button id="tipCa">下载根证书</button><button id="tipHow">怎么装？</button></div>';
    }
    box.innerHTML=h+'<button id="tipX" class="x" title="关掉这条">✕</button>'; box.classList.add("on");
    var x=$("#tipX"); if(x)x.onclick=function(){ try{localStorage.setItem("br.tipoff","1")}catch(e){}; box.classList.remove("on"); buzz() };
    var g=$("#tipGo"); if(g)g.onclick=function(){ buzz(); location.href="https://"+location.host+location.pathname+(T?"?t="+encodeURIComponent(T):"") };
    var c=$("#tipCa"); if(c)c.onclick=function(){ buzz(); location.href="/ca.crt"+(T?"?t="+encodeURIComponent(T):"") };
    // 只有"整页跳过去"才能看出证书到底信没信：同源 fetch 在"点过继续访问"的页面上照样成功，
    // 区分不出来；而整页导航要是证书没被信任，Chrome 会**再弹一次**那个警告页，一眼就看得出来。
    var k=$("#tipChk"); if(k)k.onclick=function(){ buzz();
      var msg='跳到 https://'+location.host+'/health\n\n看到什么就说明什么：\n· 直接显示 ok、没有警告 → 证书已经被信任了，是我这条误报\n· 又弹「不受信任」→ 证书没真正装上，回去看「怎么装？」\n\n（按返回键就回到这一页）';
      if(confirm(msg)) location.href="/health"+(T?"?t="+encodeURIComponent(T):"") };
    var i=$("#tipIns"); if(i)i.onclick=function(){ buzz();
      if(installEvt&&installEvt.prompt){ installEvt.prompt(); installEvt=null }
      else alert("Chrome 还没给出安装按钮。\n\n两种可能：\n一、证书还没被信任（先点「下载根证书」，装完刷新）；\n二、入口已经在菜单里了：右上角 ⋮ → 安装应用 / 添加到主屏幕。") };
    var w=$("#tipHow"); if(w)w.onclick=function(){ buzz();
      alert("装根证书的步骤（各家安卓叫法略有不同）：\n\n"+
        "1. 点「下载根证书」，文件存到手机的下载目录\n"+
        "2. 设置 → 安全（或「密码与安全」）→ 加密与凭据 → 安装证书 → CA 证书\n"+
        "   小米叫「凭据存储」；华为在「安全 → 更多安全设置 → 加密和凭据」\n"+
        "3. 选刚下载的 bedremote-ca.crt，会弹一次风险提示，确认\n"+
        "4. 回浏览器刷新这一页，顶部会变成「已信任」并出现「装到桌面」\n\n"+
        "说清楚：这张根证书是你这台电脑自己生成的，装进手机等于允许它冒充任何 https 网站。"+
        "它只在你自己的局域网里有意义。不想装也行 —— 陀螺仪不需要它，只有装成 App 才需要。") };
    var q=$("#tipQ"); if(q)q.onclick=function(){ buzz();
      if(location.protocol==="https:"&&navigator.serviceWorker&&SWOK!=="ok"){
        navigator.serviceWorker.register("/sw.js"+(T?"?t="+encodeURIComponent(T):"")).then(function(){SWOK="ok";paintTip()},function(){alert("还是不行：说明这张证书在系统里没被真正信任。重装一次，注意要按「CA 证书」装，别装成「VPN 和应用用户证书」。")});
      } else alert("翻 Chrome 菜单：右上角 ⋮ → 安装应用 / 添加到主屏幕。") };
  }
  // 关掉了要在别处能再打开（整页是个 IIFE，外面拿不到 paintTip，所以递一个函数出去）
  window.reShowTip=function(){ try{localStorage.setItem("br.tipoff","0")}catch(e){}; paintTip() };
  paintTip();
})();
</script>
